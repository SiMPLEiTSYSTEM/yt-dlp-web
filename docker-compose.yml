# ---------------------------------------------------------------------------
# Usage:
#   make up        build & start (http://<host>:5000)
#   make logs      follow logs
#   make health    print /health/json
#   make down      stop
#
# First run: open the app and complete the one-time YouTube authorization.
# The OAuth token persists in the `ytdlp_config` volume; downloaded files
# live only temporarily and are removed when the user clicks "Start Over".
# ---------------------------------------------------------------------------
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ytdlp_config:/config
      - ytdlp_downloads:/tmp/ytdlp_downloads

volumes:
  ytdlp_config:
  ytdlp_downloads:
