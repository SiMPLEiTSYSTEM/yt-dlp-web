# ---------------------------------------------------------------------------
# No source code needed — just pull and run:
#   docker compose pull && docker compose up -d
#
# Build from source instead:
#   docker compose up -d --build
#
# Makefile shortcuts:  make up | make rebuild | make logs | make health | make update | make down
#
# First run: open http://<host>:5000 and complete the one-time YouTube
# authorization. The OAuth token persists in the ytdlp_config volume.
# ---------------------------------------------------------------------------
services:
  app:
    image: ghcr.io/simpleitsystem/yt-dlp-web:latest
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ytdlp_config:/config
      - ytdlp_downloads:/tmp/ytdlp_downloads

volumes:
  ytdlp_config:
  ytdlp_downloads:
