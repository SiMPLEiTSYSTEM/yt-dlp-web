<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ brand.name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --brand-primary: {{ brand.color_primary }};
            --brand-dark: {{ brand.color_dark }};
        }
        body {
            background-color: #0b0b14;
            background-image: radial-gradient(
                1200px 600px at 50% -10%, var(--brand-dark), transparent 70%
            );
        }
        .brand-bg { background-color: var(--brand-primary); }
        .brand-text { color: var(--brand-primary); }
        .brand-border { border-color: var(--brand-primary); }
        .brand-ring:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-primary) 35%, transparent);
        }
        .brand-btn { background-color: var(--brand-primary); }
        .brand-btn:hover { filter: brightness(1.1); }
        @keyframes progress-stripes {
            from { background-position: 1rem 0; }
            to   { background-position: 0 0; }
        }
        .progress-striped {
            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.15) 25%, transparent 25%,
                transparent 50%, rgba(255, 255, 255, 0.15) 50%,
                rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent
            );
            background-size: 1rem 1rem;
            animation: progress-stripes 1s linear infinite;
        }
    </style>
</head>
<body class="h-full text-slate-100 antialiased">
    <div class="min-h-full flex flex-col">
        <header class="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur">
            <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
                <a href="{{ url_for('index') }}" class="flex items-center gap-3">
                    {% if brand.has_logo %}
                    <img src="{{ url_for('brand_logo') }}" alt="logo" class="h-9 w-auto" />
                    {% else %}
                    <div class="h-9 w-9 rounded-lg brand-bg flex items-center justify-center font-bold text-white">▶</div>
                    {% endif %}
                    <span class="text-lg font-semibold tracking-tight">{{ brand.name }}</span>
                </a>
                <nav class="flex items-center gap-5 text-sm text-slate-400">
                    <a href="{{ url_for('index') }}" class="hover:text-slate-100 transition">Home</a>
                    <a href="{{ url_for('settings') }}" class="hover:text-slate-100 transition">Settings</a>
                    <a href="{{ url_for('health') }}" class="hover:text-slate-100 transition">Health</a>
                </nav>
            </div>
        </header>

        <main class="flex-1 flex items-center justify-center px-6 py-12">
            <div class="w-full max-w-xl">
                {% block content %}{% endblock %}
            </div>
        </main>

        <footer class="border-t border-slate-800/80 py-4">
            <p class="text-center text-xs text-slate-500">
                {{ brand.name }} · Powered by
                <a href="https://github.com/yt-dlp/yt-dlp" class="brand-text hover:underline">yt-dlp</a>
            </p>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
