{% extends "base.html" %}

{% block content %}
<div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">
    <h2 class="text-2xl font-semibold mb-1">Download a video</h2>
    <p class="text-slate-400 text-sm mb-6">
        Paste a video URL below. It will be downloaded in the best quality up to
        1080p and merged into an MP4 file.
    </p>

    {% if error %}
    <div class="mb-5 rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('start') }}" method="post" class="space-y-4">
        <div>
            <label for="url" class="block text-sm font-medium text-slate-300 mb-2">Video URL</label>
            <input
                id="url"
                name="url"
                type="url"
                required
                autofocus
                placeholder="https://www.youtube.com/watch?v=..."
                class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
            />
        </div>
        <button
            type="submit"
            class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
        >
            Start Download
        </button>
    </form>

    <div class="mt-6 border-t border-slate-800 pt-4 text-center">
        <a href="{{ url_for('setup') }}" class="text-xs text-slate-500 hover:text-slate-300">
            Update YouTube cookies
        </a>
    </div>
</div>
{% endblock %}
