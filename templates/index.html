{% extends "base.html" %}

{% block content %}
<div class="bg-slate-900/70 border border-slate-800 rounded-2xl shadow-xl p-8">
    <h2 class="text-2xl font-semibold mb-1">{{ brand.tagline }}</h2>
    <p class="text-slate-400 text-sm mb-6">
        Paste a video URL, choose a quality, and download it as an MP4.
    </p>

    {% if error %}
    <div class="mb-5 rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('start') }}" method="post" class="space-y-4">
        <div>
            <label for="url" class="block text-sm font-medium text-slate-300 mb-2">Video URL</label>
            <input
                id="url" name="url" type="url" required autofocus
                placeholder="https://www.youtube.com/watch?v=..."
                class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 placeholder-slate-500 brand-ring"
            />
        </div>

        <div>
            <label for="quality" class="block text-sm font-medium text-slate-300 mb-2">Quality</label>
            <select
                id="quality" name="quality"
                class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 brand-ring"
            >
                {% for value, label in qualities %}
                <option value="{{ value }}" {% if value == 'best' %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <button
            type="submit"
            class="w-full rounded-lg brand-btn px-4 py-3 font-semibold text-white transition"
        >
            Start Download
        </button>
    </form>
</div>
{% endblock %}
